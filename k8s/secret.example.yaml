apiVersion: v1
kind: Secret
metadata:
  name: messenger-secrets
  namespace: messenger
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME_STRONG_DB_PASSWORD
  DATABASE_URL: postgresql://messenger:CHANGE_ME_STRONG_DB_PASSWORD@postgres:5432/messenger?schema=public
  JWT_ACCESS_SECRET: CHANGE_ME_ACCESS_SECRET_AT_LEAST_32_CHARS
  JWT_REFRESH_SECRET: CHANGE_ME_REFRESH_SECRET_AT_LEAST_32_CHARS
  S3_ACCESS_KEY_ID: CHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
