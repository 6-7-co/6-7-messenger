apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: messenger
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: messenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_USER/messenger-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: messenger-secrets
                  key: DATABASE_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: messenger-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: messenger-secrets
                  key: JWT_REFRESH_SECRET
            - name: JWT_ACCESS_TTL
              value: "15m"
            - name: JWT_REFRESH_TTL
              value: "30d"
            - name: ALLOWED_ORIGINS
              value: "*"
            - name: STORAGE_DRIVER
              value: "s3"
            - name: S3_ENDPOINT
              value: "https://YOUR_ACCOUNT.r2.cloudflarestorage.com"
            - name: S3_REGION
              value: "auto"
            - name: S3_BUCKET
              value: "messenger-uploads"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: messenger-secrets
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: messenger-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: S3_PUBLIC_URL
              value: "https://cdn.yourdomain.com"
            - name: MAX_UPLOAD_BYTES
              value: "10485760"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
